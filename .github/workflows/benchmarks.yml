name: HTTP benchmark smoke tests

on:
  push:
    paths:
      - 'benchmarks/http/**'
      - 'Spock/src/**'
      - 'Spock-core/src/**'
      - '**/*.cabal'
      - 'cabal.project*'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    paths:
      - 'benchmarks/http/**'
      - 'Spock/src/**'
      - 'Spock-core/src/**'
      - '**/*.cabal'
      - 'cabal.project*'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

jobs:
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.1.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate every framework and session mode
        run: |
          sh benchmarks/http/run.sh 100 8 1
          SPOCK_BENCH_COOKIES=reuse sh benchmarks/http/run.sh 100 8 1
