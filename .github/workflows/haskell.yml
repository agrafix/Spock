name: Haskell CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  postgresql:
    name: PostgreSQL session integration / GHC 9.14.1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: spock_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: spock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPOCK_TEST_POSTGRESQL: 'host=localhost port=5432 dbname=spock_test user=postgres password=spock_test'
    steps:
    - uses: actions/checkout@v7
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.14.1'
        cabal-version: '3.18.1.0'
        cabal-update: false
    - name: Install libpq
      run: sudo apt-get update && sudo apt-get install -y libpq-dev
    - run: cabal update
    - name: Build optional adapter and example
      run: cabal build all --project-file=cabal.project.postgresql
    - name: Run real database integration tests
      run: cabal test Spock-session-postgresql --project-file=cabal.project.postgresql --test-show-details=direct

  cabal:
    name: ${{ matrix.os }} / Cabal / GHC 9.14.1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Cabal and GHC
      id: setup
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.14.1'
        cabal-version: '3.18.1.0'
        cabal-update: false

    - name: Cache Cabal packages
      uses: actions/cache@v6
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: cabal-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.ghc-version }}-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          cabal-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.ghc-version }}-${{ steps.setup.outputs.cabal-version }}-

    - name: Update package index
      run: cabal update

    - name: Build libraries, tests, and benchmarks
      run: cabal build all --enable-tests --enable-benchmarks

    - name: Run tests
      run: cabal test all --test-show-details=direct

  stack:
    name: ${{ matrix.os }} / Stack / GHC 9.14.1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Stack and GHC
      id: setup
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.14.1'
        enable-stack: true
        stack-version: '3.11.1'
        cabal-update: false

    - name: Cache Stack packages
      uses: actions/cache@v6
      with:
        path: ${{ steps.setup.outputs.stack-root }}
        key: stack-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.ghc-version }}-${{ steps.setup.outputs.stack-version }}-${{ hashFiles('**/*.cabal', 'stack.yaml', 'stack.yaml.lock') }}
        restore-keys: |
          stack-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.ghc-version }}-${{ steps.setup.outputs.stack-version }}-

    - name: Build libraries, tests, and benchmarks
      run: stack build --system-ghc --no-install-ghc --test --bench --no-run-tests --no-run-benchmarks --lock-file=error-on-write

    # Running with only one thread avoids file locking conflicts on Windows.
    - name: Run tests
      run: stack test --system-ghc --no-install-ghc --lock-file=error-on-write -j 1
