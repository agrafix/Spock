name: Haskell CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  cabal:
    name: ${{ matrix.os }} / Cabal / GHC 9.14.1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Cabal and GHC
      id: setup
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.14.1'
        cabal-version: '3.18.1.0'
        cabal-update: false

    - name: Cache Cabal packages
      uses: actions/cache@v6
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: cabal-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.ghc-version }}-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          cabal-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.ghc-version }}-${{ steps.setup.outputs.cabal-version }}-

    - name: Update package index
      run: cabal update

    - name: Build libraries, tests, and benchmarks
      run: cabal build all --enable-tests --enable-benchmarks

    - name: Run tests
      run: cabal test all --test-show-details=direct

  stack:
    name: ${{ matrix.os }} / Stack / GHC 9.14.1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Stack and GHC
      id: setup
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.14.1'
        enable-stack: true
        stack-version: '3.11.1'
        cabal-update: false

    - name: Cache Stack packages
      uses: actions/cache@v6
      with:
        path: ${{ steps.setup.outputs.stack-root }}
        key: stack-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.ghc-version }}-${{ steps.setup.outputs.stack-version }}-${{ hashFiles('**/*.cabal', 'stack.yaml', 'stack.yaml.lock') }}
        restore-keys: |
          stack-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.ghc-version }}-${{ steps.setup.outputs.stack-version }}-

    - name: Build libraries, tests, and benchmarks
      run: stack build --system-ghc --no-install-ghc --test --bench --no-run-tests --no-run-benchmarks --lock-file=error-on-write

    # Running with only one thread avoids file locking conflicts on Windows.
    - name: Run tests
      run: stack test --system-ghc --no-install-ghc --lock-file=error-on-write -j 1
